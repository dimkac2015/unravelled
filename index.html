<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unravelled</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="lang-bar">
  <button id="lang-btn" aria-haspopup="listbox">EN ▾</button>
  <div id="lang-menu" role="listbox">
    <button data-lang="en">English</button>
    <button data-lang="ru">Русский</button>
    <button data-lang="be">Беларуская</button>
    <button data-lang="fr">Français</button>
  </div>
</div>

<svg id="thread-layer" aria-hidden="true">
  <path id="thread-path" d="" fill="none"/>
</svg>

<main id="app">

  <section id="screen-landing" class="screen active">
    <h1 class="logo">unravelled</h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="board">
      <input id="playlist-input" type="text" data-i18n-ph="inputPlaceholder" placeholder="">
      <button id="btn-pull" data-i18n="pull"></button>
    </div>
    <p id="landing-error" class="error"></p>
    <p class="demo-hint" data-i18n="demoHint"></p>
  </section>

  <section id="screen-loading" class="screen">
    <div id="yarn-ball" role="button" tabindex="0">
      <svg viewBox="0 0 200 200" width="240" height="240">
        <circle cx="100" cy="100" r="78" class="yarn-body"/>
        <path class="yarn-line" d="M30 80 Q100 40 170 85"/>
        <path class="yarn-line" d="M25 110 Q100 70 175 115"/>
        <path class="yarn-line" d="M30 140 Q100 105 168 145"/>
        <path class="yarn-line" d="M45 60 Q90 100 60 160"/>
        <path class="yarn-line" d="M80 35 Q120 100 95 170"/>
        <path class="yarn-line" d="M120 38 Q150 100 135 168"/>
        <path class="yarn-line" d="M155 62 Q130 105 162 150"/>
        <path id="yarn-tail" class="yarn-tail" d="M170 130 Q195 150 188 178"/>
      </svg>
    </div>
    <p class="hint" data-i18n="pullTail"></p>
    <p id="loading-line" class="loading-line"></p>
  </section>

  <section id="screen-thread" class="screen">
    <div class="cards">
      <article class="card" id="card-1">
        <p class="kicker" data-i18n="cardScene"></p>
        <div id="card-scene-art" class="scene-art"></div>
        <h2 id="card-scene-title" class="card-title"></h2>
        <p id="card-scene-verdict" class="verdict"></p>
      </article>
      <article class="card" id="card-2">
        <p class="kicker" data-i18n="cardWords"></p>
        <h2 id="card-words" class="card-title"></h2>
      </article>
      <article class="card" id="card-3">
        <p class="kicker" data-i18n="cardCharacter"></p>
        <h2 id="card-character" class="card-title"></h2>
      </article>
      <article class="card" id="card-4">
        <p class="kicker" data-i18n="cardFilm"></p>
        <h2 id="card-film" class="card-title"></h2>
        <p class="kicker" data-i18n="cardPersona"></p>
        <p id="card-persona" class="persona"></p>
      </article>
    </div>
    <button id="pull-more" class="thread-btn" data-i18n="pullMore"></button>
    <div class="actions">
      <button id="btn-share" class="ghost-btn" data-i18n="share"></button>
      <button id="btn-again" class="ghost-btn" data-i18n="again"></button>
    </div>
    <div id="curious">
      <button id="curious-toggle" class="ghost-btn" data-i18n="curious"></button>
      <p id="curious-text" class="hidden"></p>
    </div>
  </section>

</main>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
