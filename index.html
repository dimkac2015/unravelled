<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unravelled — unravel your playlist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lang-bar">
  <button id="lang-btn" aria-haspopup="listbox">EN ▾</button>
  <div id="lang-menu" role="listbox">
    <button data-lang="en">English</button>
    <button data-lang="ru">Русский</button>
    <button data-lang="be">Беларуская</button>
    <button data-lang="fr">Français</button>
  </div>
</div>

<svg id="thread-layer" aria-hidden="true">
  <path id="thread-path" d="" fill="none"/>
</svg>

<main id="app">

  <section id="screen-home" class="screen active">
    <h1 class="logo">unravelled</h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="board">
      <input id="playlist-input" type="text" data-i18n-ph="inputPlaceholder" placeholder="">
      <button id="btn-unravel" data-i18n="btnUnravel"></button>
    </div>
    <p id="home-error" class="error"></p>
  </section>

  <section id="screen-yarn" class="screen">
    <h2 data-i18n="yarnTitle"></h2>
    <div id="yarn-ball" role="button" tabindex="0" aria-label="pull the thread">
      <svg viewBox="0 0 200 200" width="220" height="220">
        <circle cx="100" cy="100" r="78" class="yarn-body"/>
        <path class="yarn-line" d="M30 80 Q100 40 170 85"/>
        <path class="yarn-line" d="M25 110 Q100 70 175 115"/>
        <path class="yarn-line" d="M30 140 Q100 105 168 145"/>
        <path class="yarn-line" d="M45 60 Q90 100 60 160"/>
        <path class="yarn-line" d="M80 35 Q120 100 95 170"/>
        <path class="yarn-line" d="M120 38 Q150 100 135 168"/>
        <path class="yarn-line" d="M155 62 Q130 105 162 150"/>
        <path id="yarn-tail" class="yarn-tail" d="M170 130 Q195 150 188 178"/>
      </svg>
    </div>
    <p class="hint" data-i18n="pullHint"></p>
  </section>

  <section id="screen-scene" class="screen">
    <div id="scene-wrap"></div>
    <div class="scene-caption">
      <h2 id="scene-name"></h2>
      <blockquote id="scene-quote"></blockquote>
      <p id="quote-note" class="quote-note" data-i18n="quoteNote"></p>
      <div id="ocean-controls" class="hidden">
        <span data-i18n="oceanLabel"></span>
        <div id="ocean-swatches" class="swatches"></div>
        <span data-i18n="skyLabel"></span>
        <div id="sky-swatches" class="swatches"></div>
      </div>
      <button class="thread-btn" data-i18n="pullThread"></button>
    </div>
  </section>

  <section id="screen-character" class="screen">
    <p class="kicker" data-i18n="characterKicker"></p>
    <h2 id="character-result" class="big-result"></h2>
    <p id="character-desc"></p>
    <button class="thread-btn" data-i18n="pullThread"></button>
  </section>

  <section id="screen-movie" class="screen">
    <p class="kicker" data-i18n="movieKicker"></p>
    <h2 id="movie-result" class="big-result"></h2>
    <p id="movie-desc"></p>
    <button class="thread-btn" data-i18n="pullThread"></button>
  </section>

  <section id="screen-reading" class="screen">
    <p class="kicker" data-i18n="readingKicker"></p>
    <div id="reading-text" class="reading"></div>
    <button id="btn-restart" data-i18n="restart"></button>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
